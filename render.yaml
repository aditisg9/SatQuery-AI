databases:
  - name: satquery-db
    plan: free
    databaseName: satquery
    user: satquery

services:
  - type: web
    name: satquery-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DEMO_MODE
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-2.0-flash"
      - key: DATABASE_URL
        fromDatabase:
          name: satquery-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: "https://your-app.vercel.app"
